spring.application.name=imobiliaria
server.port=8080

# H2 em arquivo local (./data/imobiliaria.mv.db) para os dados sobreviverem a reinicializações
spring.datasource.url=jdbc:h2:file:./data/imobiliaria;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Executa schema.sql sempre na subida (CREATE TABLE IF NOT EXISTS é seguro para reexecutar)
spring.sql.init.mode=always

# Console web do H2 para inspecionar as tabelas em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
